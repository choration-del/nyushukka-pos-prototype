<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyushukka代替POS 試作</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="notice">操作確認用の試作版 ／ 実会計には使用しないでください</div>
<nav class="menubar" aria-label="メニュー"><details><summary>ファイル(F)</summary><div><button id="settings">各種設定</button><button data-unimplemented="インポート">インポート（未実装）</button><button data-unimplemented="エクスポート">エクスポート（未実装）</button><button data-unimplemented="レシート印刷">レシート印刷（未実装）</button><button data-unimplemented="領収書印刷">領収書印刷（未実装）</button><button id="exitHelp">終了（案内）</button></div></details><details><summary>編集(E)</summary><div><button data-unimplemented="置換">置換(H)（未実装）</button><button id="search">検索(F)（商品検索）</button></div></details><details><summary>表示(V)</summary><div><button data-unimplemented="最大・通常表示切替">最大／通常表示切替（未実装）</button><button data-unimplemented="ディスプレイの色">ディスプレイの色（未実装）</button><button data-unimplemented="ボタンの色">ボタンの色（未実装）</button></div></details><details><summary>画面選択(G)</summary><div><button data-screen="register">メイン画面</button><button data-screen="products">商品リスト</button><button data-screen="suppliers">仕入先リスト</button><button data-screen="history">点検</button><button data-screen="settlement">精算</button><button data-screen="management">商品管理</button><button data-screen="customers">顧客管理</button></div></details><details><summary>分類(R)</summary><div><button data-mode="販売">販売</button><button data-mode="カード">カード</button><button data-mode="商品券">商品券</button><button data-mode="掛売">掛売</button><button data-mode="割販">割販</button><button data-mode="入金">入金</button><button data-mode="出金">出金</button><button data-mode="現金仕入">現金仕入</button><button data-mode="掛仕入">掛仕入</button><button data-mode="棚卸">棚卸</button><button data-mode="移動入庫">移動入庫</button><button data-mode="移動出庫">移動出庫</button><button data-mode="予約・注文">予約・注文</button><button data-mode="破棄">破棄</button></div></details><details><summary>ツール(T)</summary><div><button data-unimplemented="予約・注文商品受渡予定表">予約・注文商品受渡予定表（未実装）</button><button data-unimplemented="過去の販売データ読み込み">過去の販売データ読み込み（未実装）</button><button id="backupTool">バックアップ(B)</button><button data-unimplemented="自動バックアップ">自動バックアップ（未実装）</button><button data-unimplemented="画面からの復元">復元（未実装）</button><button id="drafts">仮伝票一覧（試作）</button></div></details><details><summary>ヘルプ(H)</summary><div><button id="help">目次・試作の操作案内</button><button id="version">バージョン情報</button></div></details></nav>
<div class="toolbar-main" aria-label="画面選択"><button data-screen="register">レジ</button><button data-screen="products">商品リスト</button><button data-screen="suppliers">仕入先リスト</button><button data-screen="history">点検</button><button data-screen="settlement">精算</button><button data-screen="management">商品管理</button><button data-screen="customers">顧客管理</button></div>
<div id="registerScreen" class="screen register-screen"><div class="register-top"><div class="operator-block"><h1 id="mode">販売</h1><div class="operator-fields"><label>担当者(U)<input id="operatorInput" readonly></label><button id="operatorSettings">設定(S)</button><label>天候(T)<input id="weatherInput" readonly></label><label>気温(K)<input id="temperatureInput" readonly></label></div></div><div class="messages"><div><span id="clock"></span><strong id="voucher"></strong></div><div id="modeNote"></div><div id="metadata"></div></div><div class="top-actions"><button id="operatorButton">担当者(Ctrl)</button><button id="productInfo">商品情報(F12)</button><button id="customerButton">顧客(Pause)</button><button id="memory">メモリー（未実装）</button></div></div>
<main class="register-main"><section class="register-content"><div class="grid"><table class="receipt-grid"><colgroup><col style="width:40px"><col style="width:70px"><col style="width:36%"><col style="width:15%"><col style="width:110px"><col style="width:65px"><col style="width:75px"><col style="width:120px"></colgroup><thead><tr><th>番号</th><th>商品ID</th><th>商品名</th><th>メモ</th><th>単価</th><th>税金</th><th>数量</th><th>金額</th></tr></thead><tbody id="lines"></tbody></table></div><div class="bottom-inputs"><div class="item-inputs"><label>入力キー(N)<input id="key" autocomplete="off" aria-label="入力キー"></label><label>商品名<span id="productName" class="blackbox"></span></label><label>価格<span id="productPrice" class="blackbox"></span></label></div><div class="sum-inputs"><label>小計<b id="subtotal" class="blackbox">¥0</b></label><label>内消費税額<b id="tax" class="blackbox">¥0</b></label><label>合計<b id="total" class="blackbox">¥0</b></label></div><div class="payment-inputs"><label>預かり<b id="tender" class="blackbox">—</b></label><label>お釣り<b id="change" class="blackbox">—</b></label></div><div class="paper-actions"><button id="receipt">レシート（試作）</button><button id="invoice">領収書(F11)</button></div></div><div id="modes" class="modes"></div></section><aside id="actions"></aside></main></div>
<div id="workspace" class="screen workspace" hidden></div><footer><span id="status" role="status">入力キーから商品を入力してください</span><span>試作 v0.2.2</span></footer>
<dialog id="dialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialogButtons"><button type="submit" id="ok">OK</button><button type="button" id="cancel">キャンセル</button></div><p id="dialogError" role="alert"></p></form></dialog><dialog id="confirmation"><h2>確認</h2><p id="confirmationText"></p><div class="dialogButtons"><button id="confirmationYes">はい</button><button id="confirmationNo">戻る</button></div></dialog><script src="/app.js"></script></body></html>
